<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment #4 - Simple Payroll</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a> |
        <a href="conversion.html">Conversion</a> |
        <a href="tax.html">Income Tax</a> |
        <a href="loops.html">Loops</a> |
        <a href="payroll.html">Payroll</a>
    </nav>

    <h1>Assignment #4: Simple Payroll</h1>

    <h2>Add Employee</h2>
    <label for="empName">Employee Name:</label>
    <input type="text" id="empName">

    <label for="daysWorked">Days Worked:</label>
    <input type="number" id="daysWorked" min="0" step="any">

    <label for="dailyRate">Daily Rate:</label>
    <input type="number" id="dailyRate" min="0" step="any">

    <label for="deduction">Deduction Amount:</label>
    <input type="number" id="deduction" min="0" step="any">

    <button id="addBtn">Add Employee</button>

    <h2>Delete Employee</h2>
    <label for="deleteLine">Line Number (No.):</label>
    <input type="number" id="deleteLine" min="1" step="1">
    <button id="deleteBtn">Delete</button>

    <p id="statusMsg"></p>

    <h2>Payroll Table</h2>
    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>No.</th>
                <th>Employee Name</th>
                <th>Days Worked</th>
                <th>Daily Rate</th>
                <th>Gross Pay</th>
                <th>Deduction Amount</th>
                <th>Net Pay</th>
            </tr>
        </thead>
        <tbody id="payrollBody"></tbody>
    </table>

    <script>
        const employees = [];

        const empNameEl = document.getElementById('empName');
        const daysWorkedEl = document.getElementById('daysWorked');
        const dailyRateEl = document.getElementById('dailyRate');
        const deductionEl = document.getElementById('deduction');
        const addBtn = document.getElementById('addBtn');

        const deleteLineEl = document.getElementById('deleteLine');
        const deleteBtn = document.getElementById('deleteBtn');
        const statusMsg = document.getElementById('statusMsg');
        const payrollBody = document.getElementById('payrollBody');

        const fmt = (n) => n.toFixed(2);

        const renderPayroll = () => {
            payrollBody.innerHTML = employees.map((emp, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${emp.name}</td>
                    <td>${emp.days}</td>
                    <td>${fmt(emp.rate)}</td>
                    <td>${fmt(emp.gross)}</td>
                    <td>${fmt(emp.deduction)}</td>
                    <td>${fmt(emp.net)}</td>
                </tr>
            `).join('');
        };

        const addEmployee = () => {
            const name = empNameEl.value.trim();
            const days = parseFloat(daysWorkedEl.value);
            const rate = parseFloat(dailyRateEl.value);
            const deduction = parseFloat(deductionEl.value) || 0;

            if (!name || Number.isNaN(days) || Number.isNaN(rate) || days < 0 || rate < 0 || deduction < 0) {
                statusMsg.textContent = 'Please enter valid employee values.';
                return;
            }

            const gross = days * rate;
            const net = gross - deduction;

            employees.push({ name, days, rate, gross, deduction, net });

            empNameEl.value = '';
            daysWorkedEl.value = '';
            dailyRateEl.value = '';
            deductionEl.value = '';
            statusMsg.textContent = '';

            renderPayroll();
        };

        const deleteEmployee = () => {
            const lineNo = parseInt(deleteLineEl.value, 10);
            if (Number.isNaN(lineNo) || lineNo < 1 || lineNo > employees.length) {
                statusMsg.textContent = 'Invalid line number.';
                return;
            }

            employees.splice(lineNo - 1, 1);
            deleteLineEl.value = '';
            statusMsg.textContent = '';

            renderPayroll();
        };

        addBtn.addEventListener('click', addEmployee);
        deleteBtn.addEventListener('click', deleteEmployee);
    </script>
</body>
</html>
