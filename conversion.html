<body>

    <h1>Assignment #1: Unit Conversion</h1>

    <label for="valueInput">Enter Value:</label>
    <input type="number" id="valueInput" step="any">

    <label for="unitSelect">Conversion:</label>
    <select id="unitSelect">
        <option value="cToF">Celsius to Fahrenheit</option>
        <option value="fToC">Fahrenheit to Celsius</option>
        <option value="mToFt">Meters to Feet</option>
        <option value="ftToM">Feet to Meters</option>
    </select>

    <button id="convertBtn">Convert</button>

    <p id="output">Result: -</p>

    <script>
        const valueInput = document.getElementById('valueInput');
        const unitSelect = document.getElementById('unitSelect');
        const convertBtn = document.getElementById('convertBtn');
        const output = document.getElementById('output');

        const conversions = {
            cToF: (v) => `${v} °C = ${((v * 9) / 5 + 32).toFixed(2)} °F`,
            fToC: (v) => `${v} °F = ${(((v - 32) * 5) / 9).toFixed(2)} °C`,
            mToFt: (v) => `${v} m = ${(v * 3.28084).toFixed(4)} ft`,
            ftToM: (v) => `${v} ft = ${(v / 3.28084).toFixed(4)} m`
        };

        const runConversion = () => {
            const val = parseFloat(valueInput.value);
            if (Number.isNaN(val)) {
                output.textContent = 'Result: Enter a valid number.';
                return;
            }
            output.textContent = `Result: ${conversions[unitSelect.value](val)}`;
        };

        convertBtn.addEventListener('click', runConversion);
    </script>
</body>
</html>
