    <h1>Assignment #3: Loops (First N Natural Numbers)</h1>

    <label for="nInput">Enter N:</label>
    <input type="number" id="nInput" min="1" step="1">
    <button id="computeLoopsBtn">Calculate</button>

    <p id="factorialOut">Nth Factorial (While Loop): -</p>
    <p id="sumOut">Sum of First N Numbers (Do-While Loop): -</p>
    <p id="avgOut">Average of First N Numbers (For Loop): -</p>

    <script>
        const nInput = document.getElementById('nInput');
        const computeLoopsBtn = document.getElementById('computeLoopsBtn');
        const factorialOut = document.getElementById('factorialOut');
        const sumOut = document.getElementById('sumOut');
        const avgOut = document.getElementById('avgOut');

        const factorialWhile = (n) => {
            let fact = 1;
            let i = 1;
            while (i <= n) {
                fact *= i;
                i++;
            }
            return fact;
        };

        const sumDoWhile = (n) => {
            let sum = 0;
            let i = 1;
            do {
                sum += i;
                i++;
            } while (i <= n);
            return sum;
        };

        const averageFor = (n) => {
            let total = 0;
            for (let i = 1; i <= n; i++) {
                total += i;
            }
            return total / n;
        };

        const handleLoops = () => {
            const n = parseInt(nInput.value, 10);
            if (Number.isNaN(n) || n < 1) {
                factorialOut.textContent = 'Nth Factorial (While Loop): Enter an integer greater than or equal to 1.';
                sumOut.textContent = 'Sum of First N Numbers (Do-While Loop): -';
                avgOut.textContent = 'Average of First N Numbers (For Loop): -';
                return;
            }

            factorialOut.textContent = `Nth Factorial (While Loop): ${factorialWhile(n)}`;
            sumOut.textContent = `Sum of First N Numbers (Do-While Loop): ${sumDoWhile(n)}`;
            avgOut.textContent = `Average of First N Numbers (For Loop): ${averageFor(n).toFixed(2)}`;
        };

        computeLoopsBtn.addEventListener('click', handleLoops);
    </script>
</body>
</html>
